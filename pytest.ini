[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -p no:warnings
filterwarnings =
    ignore
markers =
    auth: authentication tests
    products: products tests
    categories: categories tests
    reviews: reviews tests
    cart: cart tests
    promotions: promotions tests
    admin: admin tests
    slow: slow running tests